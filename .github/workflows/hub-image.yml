# 中枢服务端镜像随 Mac 版本发布（同一端，见 docs/installation.md「发布安装包」）。
# 推 mac-v<版本> tag 时构建 linux/amd64 + linux/arm64，推到 ghcr.io/<owner>/tacit-hub:<版本> 和 :latest。
name: hub-image

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 mac-v<版本> tag"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 版本号与 tag 一致
        id: v
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          version="$(jq -r .version package.json)"
          [ "$tag" = "mac-v$version" ] || { echo "tag $tag 与 package.json 版本 $version 不一致" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tacit-hub" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
