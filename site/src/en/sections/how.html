    <header class="section-head" data-reveal>
      <h2 class="heading" id="how-title">How Tacit works</h2>
      <p class="lead" id="how-intro">When summarizing, Tacit gives more weight to records that show what you intended.</p>
    </header>

    <figure aria-labelledby="how-title" aria-describedby="how-intro">
      <div class="how-flow" data-reveal-group>

            <svg aria-hidden="true" class="how-source-icon"><use href="assets/sources.svg#note"/></svg>
            <div>
              <h3>What you say and write</h3>
              <p>AI sessions, messages you send, your words in recordings and notes you add.</p>
            </div>
          </li>
          <li>
            <svg aria-hidden="true" class="how-source-icon"><use href="assets/sources.svg#chat"/></svg>
            <div>
              <h3>What others tell you</h3>
              <p>Incoming messages and other speakers in recordings. WeChat is an optional source on Mac.</p>
            </div>
          </li>
          <li>
            <svg aria-hidden="true" class="how-source-icon"><use href="assets/sources.svg#screen"/></svg>
            <div>
              <h3>What you look at</h3>
              <p>App names, page titles and time spent help place activities. You can search screen and browser text. Summaries leave that text out.</p>
            </div>
          </li>
        </ol>

            <li>What happened</li>

        <ul class="how-outputs" role="list" aria-label="Where summaries appear">
          <li>
            <h3>For you</h3>
            <p>Review your day and expand an activity to read the original records.</p>
          </li>
          <li>
            <h3>For AI tools</h3>
            <p>Your AI checks project progress and searches records through MCP.</p>
          </li>

      <figcaption class="how-caption prose" data-reveal style="--reveal-delay: 240ms">
        <p>Tacit reads screen text in memory and discards the screenshots. The database is encrypted on your device.</p>
        <p>A draft appears as soon as a record arrives. By default, the model summarizes the activity after <span class="num">30 min</span> without new records and updates the day overview every hour. You can change the timing in settings.</p>
      </figcaption>
