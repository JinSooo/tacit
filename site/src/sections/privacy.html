<section class="section" id="privacy" aria-labelledby="privacy-heading">
  <div class="wrap">
    <header class="section-head">
      <h2 class="heading" id="privacy-heading">数据在你的 Mac 上</h2>
      <div class="lead">
        <p>用云端模型整理时，相关文字会发给你配置的模型服务。</p>
        <p>AI 工具查到的内容会进入它的会话。</p>
      </div>
      <p class="privacy-policy"><svg aria-hidden="true"><use href="assets/sources.svg#lock"/></svg>不收集遥测，也不提供云端托管。</p>
    </header>

    <dl class="privacy-list">
      <div>
        <dt>加密存储</dt>
        <dd>数据库、原始音频和待发送记录都加密保存在本机，密钥放在 macOS 钥匙串里。</dd>
      </div>
      <div>
        <dt>不存截图</dt>
        <dd>截图只在内存里用来识字。</dd>
      </div>
      <div>
        <dt>录音转写</dt>
        <dd>录音默认在本机转写，没有你声音的对话只在开会时转写。</dd>
      </div>
      <div>
        <dt>私密记录</dt>
        <dd>标成 <code>private</code> 的记录默认不参加整理，也不会自动带入新会话，AI 工具主动查询时仍能读到。</dd>
      </div>
      <div>
        <dt>写入前拦截密钥</dt>
        <dd>已知格式的密钥和令牌会在写入前拦下，其他格式可能漏判。</dd>
      </div>
      <div>
        <dt>删除原文和旧摘要</dt>
        <dd>删除会从数据库移除原文，并立即撤下引用它的旧摘要。</dd>
      </div>
    </dl>
  </div>
</section>
